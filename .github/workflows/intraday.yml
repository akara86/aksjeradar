# Intradag: hvert 15. minutt på ukedager i børstiden (07:00–20:59 UTC dekker Oslo 09:00 til USA stenger 22:00 norsk tid).
# Henter siste publiserte nettside (fra den daglige kjøringen), legger til ferske intradag-setups
# (docs/intraday.json) og publiserer hele nettsiden på nytt. Den daglige analysen rører ikke dette.
#
# GitHub kan være 5–20 minutter forsinket med planlagte kjøringer når det er travelt – det er normalt.
# Loggen over setups (for etterprøving) leses fra sist publiserte intraday.json og skrives tilbake dit.

name: Aksjeradar intradag

on:
  schedule:
    - cron: "*/15 7-20 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write   # for å starte neste kjøring selv

concurrency:
  group: aksjeradar-pages
  cancel-in-progress: false

jobs:
  intradag:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Noter starttid
        run: echo "START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Installer avhengigheter
        run: pip install -r requirements.txt
      - name: Hent siste publiserte nettside (data.json, aksjefiler, autotrader)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Nyeste vellykkede daglige kjøring som faktisk har en nettside (kjøringer som hoppet over analysen har ingen)
          for RUN_ID in $(gh api "repos/${{ github.repository }}/actions/workflows/daily.yml/runs?per_page=30" --jq '[.workflow_runs[] | select(.conclusion=="success")] | sort_by(.created_at) | reverse | .[].id'); do
            if gh run download "$RUN_ID" -n site -D site 2>/dev/null; then echo "Bruker nettside fra daglig kjøring $RUN_ID"; break; fi
          done
          ls site | head
      - name: Lag intradag-setups og etterprøv gårsdagens
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python intraday_run.py --site site
      - name: Lagre 15m-barer (den daglige kjøringen tar dem med videre)
        uses: actions/upload-artifact@v4
        with:
          name: intraday-bars
          path: site/intraday
          retention-days: 3
          if-no-files-found: ignore
      - name: Klargjør GitHub Pages
        uses: actions/configure-pages@v5
      - name: Pakk nettsiden
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publiser
        id: deployment
        uses: actions/deploy-pages@v4
      # GitHub hopper ofte over planlagte kjøringer (den 18.11 kom ingen i det hele tatt). Derfor starter hver
      # kjøring den neste selv, ca. 15 min etter at den startet – i børstiden på ukedager. Planen over er reserve.
      - name: Start neste kjøring om ca. 15 minutter
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          D=$(date -u +%u); H=$(date -u +%H)
          if [ "$D" -le 5 ] && [ "$((10#$H))" -ge 7 ] && [ "$((10#$H))" -lt 21 ]; then
            WAIT=$(( 840 - ( $(date +%s) - START ) ))
            if [ "$WAIT" -gt 0 ]; then sleep "$WAIT"; fi
            gh api -X POST "repos/${{ github.repository }}/actions/workflows/intraday.yml/dispatches" -f ref=main && echo "Neste kjøring startet"
          else
            echo "Utenfor børstiden – ingen ny kjøring (den daglige kjøringen starter kjeden igjen i morgen)"
          fi
