name: Fondskontroll (ekte andelskurser)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python tools/nav_probe.py nav_probe.json
      - run: python tools/verify_published.py published.json
      - run: python tools/holdings_probe.py holdings_probe.json
      - run: python tools/debug_stress.py debug_stress.json
      - run: |
          curl -sf https://akara86.github.io/aksjeradar/funds.json -o site_funds.json
          curl -sf https://akara86.github.io/aksjeradar/funds_now.json -o site_funds_now.json
      - name: Lagre resultatet på egen gren
        run: |
          git config user.name "aksjeradar-bot"
          git config user.email "aksjeradar-bot@users.noreply.github.com"
          git checkout --orphan kontroll
          git rm -rfq --cached . >/dev/null
          git add -f nav_probe.json published.json holdings_probe.json debug_stress.json site_funds.json site_funds_now.json
          git commit -qm "Fondskontroll $(date -u +%F)"
          git push -fq origin kontroll
