name: Fondskontroll (ekte andelskurser)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python tools/nav_probe.py nav_probe.json
      - name: Lagre resultatet på egen gren
        run: |
          git config user.name "aksjeradar-bot"
          git config user.email "aksjeradar-bot@users.noreply.github.com"
          git checkout --orphan kontroll
          git rm -rfq --cached . >/dev/null
          git add -f nav_probe.json
          git commit -qm "Fondskontroll $(date -u +%F)"
          git push -fq origin kontroll
