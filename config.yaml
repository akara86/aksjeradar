universe_extra:
  sp500: true               # legg til hele S&P 500 (hentes fra Wikipedia ved hver kjøring)

data:
  history_period: "2y"            # kurshistorikk som hentes (1y, 2y, 5y ...)
  fundamentals_max_age_days: 3    # fundamental-/analytikerdata gjenbrukes så mange dager før de hentes på nytt
  max_details_per_run: 350        # maks aksjer som får hentet fundamentaldata per kjøring (de eldste først)
  request_pause: 0.3              # sekunder pause mellom hver aksje (vær snill med Yahoo)
  db_path: "data/aksjeradar.db"

signals:
  rsi_period: 14
  sma_fast: 50
  sma_slow: 200
  volume_spike_mult: 2.0          # volum >= 2x 20-dagers snitt = "volumhopp"
  breakout_lookback: 60           # utbrudd = kurs over høyeste de siste 60 dagene

scoring:
  weights:                        # summen trenger ikke bli 1 – de normaliseres
    technical: 0.35
    analyst: 0.25
    fundamental: 0.25
    insider: 0.15
  min_analysts: 3                 # færre analytikere enn dette -> ingen analytikerscore

report:
  top_n: 10                       # antall i "topp"-listen
  per_category: 6                 # antall ideer per kategori
  screener_rows: 60               # rader i screener-tabellen i rapporten
  output_dir: "reports"

notify:
  telegram: true                  # krever TELEGRAM_BOT_TOKEN og TELEGRAM_CHAT_ID i .env
  email: false                    # krever SMTP_* og EMAIL_TO i .env

export:
  json_path: "docs/data.json"     # lett indeks som mobil-appen leser ved oppstart
  details_dir: "docs/stocks"      # én detaljfil per aksje (hentes når du åpner aksjen)
  history_days: 130               # antall kursdager i grafen i appen
  spark_days: 30                  # antall kursdager i de små grafene i listene
