universe_extra:
  sp500: true               # legg til hele S&P 500 (hentes fra Wikipedia ved hver kjøring)

data:
  history_period: "2y"            # kurshistorikk som hentes (1y, 2y, 5y ...)
  fundamentals_max_age_days: 3    # fundamental-/analytikerdata gjenbrukes så mange dager før de hentes på nytt
  max_details_per_run: 450        # maks aksjer som får hentet fundamentaldata per kjøring (de eldste først)
  request_pause: 0.25             # sekunder pause mellom hver aksje (vær snill med Yahoo)
  db_path: "data/aksjeradar.db"

signals:
  rsi_period: 14
  sma_fast: 50
  sma_slow: 200
  volume_spike_mult: 2.0          # volum >= 2x 20-dagers snitt = "volumhopp"
  breakout_lookback: 60           # utbrudd = kurs over høyeste de siste 60 dagene

scoring:
  weights:                        # summen trenger ikke bli 1 – de normaliseres
    technical: 0.35
    analyst: 0.25
    fundamental: 0.25
    insider: 0.15
  min_analysts: 3                 # færre analytikere enn dette -> ingen analytikerscore

report:
  top_n: 10                       # antall i "topp"-listen
  per_category: 6                 # antall ideer per kategori
  screener_rows: 60               # rader i screener-tabellen i rapporten
  output_dir: "reports"

notify:
  telegram: true                  # krever TELEGRAM_BOT_TOKEN og TELEGRAM_CHAT_ID i .env
  email: false                    # krever SMTP_* og EMAIL_TO i .env
  push:                           # push-varsler til mobilen via ntfy (gratis app: ntfy.sh)
    enabled: true
    ntfy_server: "https://ntfy.sh"
    ntfy_topic: "aksjeradar-fvrmjamfiy12"         # abonner på dette emnet i ntfy-appen. Kan overstyres med hemmeligheten NTFY_TOPIC.
    app_url: "https://akara86.github.io/aksjeradar/"   # varselet åpner appen
    morning: true                 # daglig oppsummering etter morgenkjøringen
    funds: true                   # når et fond skifter til/fra gunstig inngang
    autotrader: true              # når autotraderen handler
    intraday: true                # nye intradag-setups i børstiden
    max_intraday_per_day: 6       # tak på intradag-varsler per dag

autotrader:                       # virtuell portefølje som følger anbefalingene automatisk (egen fane i appen)
  enabled: true
  start_cash: 100000              # startkapital i basisvaluta
  base_currency: "NOK"
  max_positions: 10               # like store posisjoner: total verdi / max_positions
  max_per_market: 4               # maks posisjoner per børs (0 = ingen grense)
  min_score: 65                   # kjøper bare Sterkt kjøp/Kjøp med score >= dette
  stop_loss_pct: 0.12             # selger hvis kursen er 12 % under snittkurs
  min_hold_days: 5                # selger ikke på anbefaling/trendbrudd før etter 5 dager (stop-loss gjelder alltid)
  cooldown_days: 10               # venter 10 dager før en solgt aksje kan kjøpes igjen
  commission_pct: 0.0005          # kurtasje 0,05 % per handel
  slippage_pct: 0.002             # 0,2 % dårligere kurs enn sluttkursen, i disfavør

intraday:                         # intradag-modul: setups på 15-minutters kurser (egen fane i appen)
  enabled: true
  interval: "15m"
  max_tickers: 120                # universet under + dagens kjøpskandidater + autotraderens beholdning
  include_buy_candidates: true
  include_autotrader_holdings: true
  universe:
    oslo: [EQNR.OL, DNB.OL, AKRBP.OL, NHY.OL, YAR.OL, MOWI.OL, SALM.OL, LSG.OL, TEL.OL, ORK.OL, KOG.OL, TOM.OL,
           STB.OL, GJF.OL, NOD.OL, AKSO.OL, SUBC.OL, VAR.OL, FRO.OL, HAFNI.OL, BWLPG.OL, MPCC.OL, AUTO.OL, KIT.OL,
           ELK.OL, NEL.OL, BAKKA.OL, AKER.OL, ATEA.OL, BORR.OL, DNO.OL, SCATC.OL, TGS.OL, PROT.OL, NAS.OL, GSF.OL,
           HEX.OL, OKEA.OL, WAWI.OL, VEND.OL]
    usa: [AAPL, MSFT, NVDA, AMZN, META, GOOGL, TSLA, AMD, AVGO, NFLX, PLTR, COIN, MSTR, UBER, SHOP, CRM, ORCL, MU,
          SMCI, ARM, INTC, QCOM, BA, JPM, BAC, XOM, CVX, LLY, UNH, ABBV, PFE, MRK, COST, WMT, HD, DIS, NKE, SBUX,
          MCD, PEP, KO, V, MA, GS, MS, C, WFC, CAT, DE, GE]
    stockholm: [VOLV-B.ST, ERIC-B.ST, ABB.ST, ATCO-A.ST, INVE-B.ST, SEB-A.ST, SAND.ST, HM-B.ST, EVO.ST, BOL.ST]
    copenhagen: [NOVO-B.CO, MAERSK-B.CO, DSV.CO, ORSTED.CO, VWS.CO, CARL-B.CO, GMAB.CO]
    helsinki: [NOKIA.HE, NESTE.HE, UPM.HE, FORTUM.HE, SAMPO.HE]
  rules:
    min_gap_pct: 0.02             # Gap-and-go krever minst 2 % gap opp
    min_rel_volume: 1.3           # volum minst 1,3x normalt for klokkeslettet
    max_rsi: 80                   # ikke kjøp når 15m-RSI er over 80
    target_r: 2.0                 # mål = 2x risikoen (avstand til stop)
    min_stop_pct: 0.004           # stop minst 0,4 % unna (ellers støy)
    max_stop_pct: 0.04            # stop maks 4 % unna

funds:                            # aksjefond: gunstige innganger ut fra fall i NOK og valuta (under «Mer» i appen)
  enabled: true
  base_currency: "NOK"
  thresholds:
    good_drawdown: -0.08          # >= 8 % under 52-ukers topp (i NOK) = Gunstig
    strong_drawdown: -0.15        # >= 15 % = Svært gunstig
    fx_expensive: 0.04            # kronen 4 % svakere enn 200d-snitt + fond nær topp = Dyr
  # Hvert fond kobles til en ETF (proxy) som følger samme indeks. currency = ETF-ens handelsvaluta.
  # hedged: true = valutasikret fond (ingen valutaeffekt). fx_relevant: false = underliggende i NOK uansett.
  # owned: true = du eier fondet (gir konkret råd). role: kjerne/satellitt. markets/sectors kobler fondet til
  # aksjeanalysen (børser: Oslo, Stockholm, København, Helsinki, USA, alle; sektorer: Yahoo-navn som Technology,
  # Healthcare, Energy, Financial Services, Industrials, Utilities, Consumer Cyclical, Consumer Defensive ...).
  list:
    # ---- Dine fond ----
    - id: klp_global
      name: "KLP AksjeGlobal Indeks"
      examples: "Ditt fond · følger MSCI World"
      proxy: URTH
      currency: USD
      owned: true
      role: kjerne
      markets: [alle]
    - id: storebrand_solutions
      name: "Storebrand Global Solutions"
      examples: "Ditt fond · aktivt forvaltet, referanseindeks MSCI ACWI – ETF-en er en tilnærming"
      proxy: ACWI
      currency: USD
      owned: true
      role: satellitt
      markets: [alle]
    - id: gambak
      name: "Alfred Berg Gambak"
      examples: "Ditt fond · aktivt forvaltet norsk fond – følges via Oslo Børs-ETF (tilnærming)"
      proxy: NORW
      currency: USD
      fx_relevant: false          # norske aksjer – valutaen nøytraliseres når ETF-en regnes om til NOK
      owned: true
      role: satellitt
      markets: [Oslo]
    - id: klp_em
      name: "KLP AksjeFremvoksende Markeder Indeks"
      examples: "Ditt fond · følger MSCI Emerging Markets"
      proxy: IEMG
      currency: USD
      owned: true
      role: satellitt
    - id: dnb_teknologi
      name: "DNB Teknologi"
      examples: "Ditt fond · aktivt forvaltet teknologi/telekom/media – følges via Nasdaq-100 (tilnærming)"
      proxy: QQQ
      currency: USD
      owned: true
      role: satellitt
      sectors: [Technology, Communication Services]
    # ---- Andre fondstyper (til sammenligning og ideer) ----
    - id: usa
      name: "USA – S&P 500"
      examples: "KLP AksjeUSA Indeks, DNB USA Indeks, Storebrand Indeks USA"
      proxy: SPY
      currency: USD
      role: kjerne
      markets: [USA]
    - id: global_hedged
      name: "Globalt indeksfond, valutasikret til NOK"
      examples: "KLP AksjeGlobal Indeks Valutasikret, DNB Global Indeks Valutasikret"
      proxy: URTH
      currency: USD
      hedged: true
      role: kjerne
      markets: [alle]
    - id: norge
      name: "Norge – indeksfond"
      examples: "KLP AksjeNorge Indeks, DNB Norge Indeks, Nordnet Indeksfond Norge"
      proxy: NORW
      currency: USD
      fx_relevant: false
      role: kjerne
      markets: [Oslo]
    - id: europa
      name: "Europa"
      examples: "KLP AksjeEuropa Indeks, DNB Europa Indeks"
      proxy: VGK
      currency: USD
      role: kjerne
      markets: [Stockholm, København, Helsinki]
    - id: helse
      name: "Helse (global)"
      examples: "DNB Health Care (nær)"
      proxy: XLV
      currency: USD
      role: satellitt
      sectors: [Healthcare]
    - id: fornybar
      name: "Fornybar energi"
      examples: "DNB Miljøinvest, Storebrand Fornybar Energi (nær)"
      proxy: ICLN
      currency: USD
      role: satellitt
      sectors: [Utilities]

gurus:                            # kjente investorer – porteføljer fra SEC EDGAR (13F), egen fane «Guruer»
  enabled: true
  refresh_days: 1                 # sjekk daglig om det er kommet ny 13F (selve rapportene kommer kvartalsvis)
  # contact: "navn@epost.no"      # SEC krever kontaktadresse i forespørslene; standard er GitHub-kontoens noreply-adresse
  # cik = SEC-ID for forvaltningsselskapet. Mangler eller feil cik slås opp via edgar_name automatisk.
  list:
    - id: buffett
      name: "Warren Buffett"
      firm: "Berkshire Hathaway"
      cik: 1067983
      style: "Verdi, kvalitet, evig eierhorisont"
      bio: "Berkshires bokførte verdi per aksje har vokst rundt 20 % årlig siden 1965 – dobbelt så mye som S&P 500. Kjøper enkle, lønnsomme selskaper med varige konkurransefortrinn og holder dem i tiår."
    - id: druckenmiller
      name: "Stanley Druckenmiller"
      firm: "Duquesne Family Office"
      cik: 1536411
      style: "Makro, konsentrert, rask på foten"
      bio: "Rapportert ca. 30 % årlig avkastning i 30 år uten et eneste tapsår mens han drev Duquesne. Kjent for store, konsentrerte veddemål og for å snu raskt når han tar feil."
    - id: burry
      name: "Michael Burry"
      firm: "Scion Asset Management"
      cik: 1649339
      style: "Dypverdi, contrarian"
      bio: "Kjent fra «The Big Short» for å ha tjent stort på boligkrakket i 2008. Få, store posisjoner i upopulære aksjer – porteføljen snus ofte helt om fra kvartal til kvartal."
    - id: ackman
      name: "Bill Ackman"
      firm: "Pershing Square Capital Management"
      cik: 1336528
      style: "Konsentrert kvalitet, aktivist"
      bio: "8–12 store posisjoner i selskaper med sterke merkevarer og forutsigbar kontantstrøm. Pershing Square Holdings har gitt rundt 15 % årlig siden 2004, med store svingninger underveis."
    - id: tepper
      name: "David Tepper"
      firm: "Appaloosa Management"
      cik: 1656456
      style: "Makro og «distressed», opportunistisk"
      bio: "Blant de best betalte hedgefondforvalterne noensinne, med rapportert ca. 25 % årlig over flere tiår. Kjøper aggressivt når markedet er i panikk."
    - id: klarman
      name: "Seth Klarman"
      firm: "The Baupost Group"
      cik: 1061768
      style: "Verdi med sikkerhetsmargin"
      bio: "Forfatter av «Margin of Safety». Baupost har levert rundt 20 % årlig siden 1982 med lav risiko og mye kontanter når det er lite å kjøpe."
    - id: lilu
      name: "Li Lu"
      firm: "Himalaya Capital Management"
      cik: 1709323
      style: "Verdi, svært konsentrert, lang horisont"
      bio: "Charlie Mungers favorittforvalter og mannen bak Berkshires BYD-investering. Eier et fåtall selskaper i mange år."
    - id: einhorn
      name: "David Einhorn"
      firm: "Greenlight Capital"
      cik: 1079114
      style: "Verdi, long/short"
      bio: "Kjent for å ha avslørt Lehman Brothers før kollapsen i 2008. Greenlight ga ca. 20 % årlig det første tiåret; blandet senere."
    - id: loeb
      name: "Daniel Loeb"
      firm: "Third Point"
      cik: 1040273
      style: "Hendelsesdrevet, aktivist"
      bio: "Third Point har gitt rundt 15 % årlig siden 1995. Kjent for skarpe brev til ledelsen i selskaper han vil endre."
    - id: coleman
      name: "Chase Coleman"
      firm: "Tiger Global Management"
      cik: 1167483
      style: "Vekst, teknologi"
      bio: "«Tiger cub» etter Julian Robertson. Svært gode år innen teknologi og internett på 2010-tallet, et svært dårlig 2022."
    - id: mandel
      name: "Stephen Mandel"
      firm: "Lone Pine Capital"
      cik: 1061165
      style: "Vekst til fornuftig pris"
      bio: "En av de mest respekterte «Tiger cubs», rundt 20 % årlig i de første 15 årene. Langsiktig i kvalitetsvekst."
    - id: akre
      name: "Chuck Akre"
      firm: "Akre Capital Management"
      cik: 1112520
      style: "Kvalitet, «tre bein»: forretning, ledelse, reinvestering"
      bio: "Akre Focus Fund slo S&P 500 klart i over et tiår med en kort liste av selskaper med høy avkastning på kapitalen."
    - id: marks
      name: "Howard Marks"
      firm: "Oaktree Capital Management"
      cik: 949509
      style: "Verdi, kreditt, syklusforståelse"
      bio: "Forfatter av de kjente «memos» og boken «The Most Important Thing». Oaktree er spesialist på kriser og nødlidende gjeld."
    - id: greenblatt
      name: "Joel Greenblatt"
      firm: "Gotham Asset Management"
      cik: 1510387
      style: "Systematisk verdi («den magiske formelen»)"
      bio: "Gotham Capital ga rundt 40 % årlig i 1985–1994. Kjøper billige, lønnsomme selskaper etter en fast formel – svært mange posisjoner."
    - id: soros
      name: "George Soros"
      firm: "Soros Fund Management"
      cik: 1029160
      style: "Makro"
      bio: "Quantum Fund ga rundt 30 % årlig i tre tiår. Fondet forvaltes i dag av et team, men porteføljen er fortsatt interessant for makroveddemål."

export:
  json_path: "docs/data.json"     # lett indeks som mobil-appen leser ved oppstart
  details_dir: "docs/stocks"      # én detaljfil per aksje (hentes når du åpner aksjen)
  history_days: 520               # antall kursdager i grafen i appen (520 ≈ 2 år)
  spark_days: 30                  # antall kursdager i de små grafene i listene
