<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aksjeradar</title>
<meta name="description" content="Daglig fondsrapport med innskuddsråd, og estimert verdi av fondene dine akkurat nå.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151d27" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Aksjeradar">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">

</head>
<body>

  <div class="gutter">

      <div class="brand">
        <span id="brand-icon" style="color:var(--accent);display:flex"></span>
        <div><h1>Aksjeradar</h1><small id="brand-sub"></small></div>

  </div>

<main class="gutter">
  <div id="banners"></div>
  <div id="view"></div>
</main>
<nav class="tabs" aria-label="Faner"><div id="tabs" class="tabs-inner gutter"></div></nav>
